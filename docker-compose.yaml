services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ws-kw-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      SEED_TOKEN: ${SEED_TOKEN:?SEED_TOKEN is required}
    volumes:
      - payload_db:/app/data
      - payload_media:/app/media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  payload_db:
  payload_media:
